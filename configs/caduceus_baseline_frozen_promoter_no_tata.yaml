# Frozen-backbone baseline config for promoter_no_tata (Stage 3).
# 中文：冻结 Caduceus backbone，只训练分类头的 baseline 对照实验。

experiment_name: caduceus_baseline_frozen_promoter_no_tata

dataset:
  name: promoter_no_tata
  train_csv: data/processed/promoter_no_tata/train.csv
  val_csv: data/processed/promoter_no_tata/val.csv
  test_csv: data/processed/promoter_no_tata/test.csv
  max_length: 1024

model:
  backbone: caduceus_ps_1k
  use_hila: false
  num_labels: 2
  freeze_backbone: true

training:
  seed: 42
  batch_size: 64
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-3
  weight_decay: 0.01
  epochs: 15
  early_stopping_patience: 3
  fp16: true
  metric_for_best_model: f1

output:
  output_dir: outputs/caduceus_baseline_frozen/promoter_no_tata/seed42
